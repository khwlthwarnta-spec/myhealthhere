workflows:
  android-apk:
    name: "صحتك أولاً — Android APK"
    max_build_duration: 60
    environment:
      node: "20"
      java: "17"
      vars:
        APP_DIR: artifacts/sehatak-app

    scripts:
      - name: Setup pnpm
        script: |
          npm install -g pnpm@9 --force
          pnpm --version

      - name: Install workspace dependencies
        script: |
          pnpm install --no-frozen-lockfile

      - name: Expo prebuild — generate Android project
        script: |
          cd $APP_DIR
          npx expo prebuild --platform android --clean --no-install

      - name: Fix gradlew permissions
        script: chmod +x $APP_DIR/android/gradlew

      - name: Build debug APK
        script: |
          cd $APP_DIR/android
          ./gradlew assembleDebug --no-daemon --stacktrace

    artifacts:
      - artifacts/sehatak-app/android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - khwlthwarnta@gmail.com
        notify:
          success: true
          failure: true
