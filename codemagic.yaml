workflows:
  android-apk:
    name: "صحتك أولاً — Android APK"
    max_build_duration: 60
    environment:
      node: "22"
      java: "17"
      vars:
        APP_DIR: artifacts/sehatak-app
        EXPO_PUBLIC_API_URL: "https://bbb7fde6-d2f6-4a0b-af69-a0227ca0dff4-8080.sisko.replit.dev"

    scripts:
      - name: Setup pnpm
        script: |
          npm install -g pnpm@10 --force
          pnpm --version

      - name: Install workspace dependencies
        script: pnpm install --no-frozen-lockfile

      - name: Expo prebuild — generate Android project
        script: |
          cd $APP_DIR
          npx expo prebuild --platform android --clean --no-install

      - name: Fix gradlew permissions
        script: chmod +x $APP_DIR/android/gradlew

      - name: Reduce APK size — arm64-v8a only
        script: |
          sed -i 's/defaultConfig {/defaultConfig {\n        ndk { abiFilters "arm64-v8a" }/' \
            $APP_DIR/android/app/build.gradle
          echo "✅ ABI filter injected"

      # ── بناء JS bundle يدوياً (المسار المطلق يضمن صحة الـ monorepo) ────────
      - name: Bundle JavaScript manually
        script: |
          cd $APP_DIR
          mkdir -p android/app/src/main/assets
          ENTRY="$PWD/node_modules/expo-router/entry.js"
          echo "✅ Entry: $ENTRY"
          EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL \
          NODE_ENV=production \
          npx expo export:embed \
            --platform android \
            --entry-file "$ENTRY" \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --dev false
          echo "✅ Bundle size: $(wc -c < android/app/src/main/assets/index.android.bundle) bytes"

      # ── بناء APK مع تخطي خطوة bundle (تمت يدوياً) ────────────────────────
      - name: Build release APK
        script: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
          cd $APP_DIR/android
          ./gradlew assembleRelease \
            -x createBundleReleaseJsAndAssets \
            --no-daemon

      - name: Rename APK to sehatak.apk
        script: |
          find $APP_DIR/android/app/build/outputs/apk -name "*.apk" \
            -exec cp {} $APP_DIR/android/app/build/outputs/apk/release/sehatak.apk \;
          echo "✅ APK ready: sehatak.apk"

    artifacts:
      - artifacts/sehatak-app/android/app/build/outputs/apk/release/sehatak.apk

    publishing:
      email:
        recipients:
          - khwlthwarnta@gmail.com
        notify:
          success: true
          failure: true
