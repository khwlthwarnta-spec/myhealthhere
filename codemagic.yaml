workflows:
  android-apk:
    name: "صحتك أولاً — Android APK"
    max_build_duration: 60
    environment:
      node: "22"
      java: "17"
      vars:
        APP_DIR: artifacts/sehatak-app
        EXPO_PUBLIC_API_URL: "https://bbb7fde6-d2f6-4a0b-af69-a0227ca0dff4-8080.sisko.replit.dev"

    scripts:
      - name: Setup pnpm
        script: |
          npm install -g pnpm@10 --force
          pnpm --version

      - name: Install workspace dependencies
        script: pnpm install --no-frozen-lockfile

      - name: Expo prebuild — generate Android project
        script: |
          cd $APP_DIR
          npx expo prebuild --platform android --clean --no-install

      - name: Fix gradlew permissions
        script: chmod +x $APP_DIR/android/gradlew

      - name: Reduce APK size — arm64-v8a only
        script: |
          BUILD_GRADLE="$APP_DIR/android/app/build.gradle"
          sed -i.bak 's/defaultConfig {/defaultConfig {\n        ndk { abiFilters "arm64-v8a" }/' "$BUILD_GRADLE"
          rm -f "$BUILD_GRADLE.bak"
          echo "✅ ABI filter injected"

      - name: Pre-build JavaScript bundle
        script: |
          cd $APP_DIR
          mkdir -p android/app/src/main/assets
          ENTRY="$PWD/node_modules/expo-router/entry.js"
          echo "✅ Entry: $ENTRY"
          NODE_ENV=production \
          EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL \
          npx expo export:embed \
            --platform android \
            --entry-file "$ENTRY" \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --dev false
          BUNDLE_SIZE=$(wc -c < android/app/src/main/assets/index.android.bundle)
          echo "✅ Bundle size: $BUNDLE_SIZE bytes"
          if [ "$BUNDLE_SIZE" -lt 100000 ]; then
            echo "❌ Bundle too small"
            exit 1
          fi

      - name: Skip Gradle Metro re-bundling — use pre-built bundle
        script: |
          cat >> $APP_DIR/android/app/build.gradle << 'GRADLE_PATCH'

// Use pre-built JS bundle from CI — skip Metro re-bundling
tasks.matching { it.name == "createBundleReleaseJsAndAssets" }.configureEach {
    onlyIf { false }
}
GRADLE_PATCH
          echo "✅ Gradle bundle task patched"

      - name: Build release APK
        script: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
          cd $APP_DIR/android
          ./gradlew assembleRelease --no-daemon

      - name: Copy APK to sehatak.apk
        script: |
          APK=$(find $APP_DIR/android/app/build/outputs/apk -name "*.apk" | grep -v sehatak | head -1)
          if [ -z "$APK" ]; then
            APK=$(find $APP_DIR/android/app/build/outputs/apk -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "❌ No APK found"
            exit 1
          fi
          echo "✅ APK: $APK ($(wc -c < "$APK") bytes)"
          cp "$APK" $APP_DIR/android/app/build/outputs/apk/release/sehatak.apk

    artifacts:
      - artifacts/sehatak-app/android/app/build/outputs/apk/release/sehatak.apk

    publishing:
      email:
        recipients:
          - khwlthwarnta@gmail.com
        notify:
          success: true
          failure: true
