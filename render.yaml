services:
  - type: web
    name: sehatak
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/health-awareness run build
    staticPublishPath: artifacts/health-awareness/dist/public
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
