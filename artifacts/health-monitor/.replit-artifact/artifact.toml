kind = "web"
previewPath = "/health-monitor/"
title = "Health Monitor - Bluetooth"
version = "1.0.0"
id = "artifacts/health-monitor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/health-monitor/" ]
localPort = 19526

[services.development]
run = "pnpm --filter @workspace/health-monitor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/health-monitor", "run", "build" ]
publicDir = "artifacts/health-monitor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19526"
BASE_PATH = "/health-monitor/"
