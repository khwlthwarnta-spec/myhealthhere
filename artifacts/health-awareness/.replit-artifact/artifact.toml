kind = "web"
previewPath = "/"
title = "صحتك أولاً - Health Awareness"
version = "1.0.0"
id = "artifacts/health-awareness"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20151

[services.development]
run = "pnpm --filter @workspace/health-awareness run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/health-awareness", "run", "build" ]
publicDir = "artifacts/health-awareness/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20151"
BASE_PATH = "/"
