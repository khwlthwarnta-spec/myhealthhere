name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'artifacts/sehatak-app/**'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Run Expo Prebuild
        working-directory: artifacts/sehatak-app
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Create assets directory
        run: mkdir -p artifacts/sehatak-app/android/app/src/main/assets

      - name: Bundle JavaScript manually
        working-directory: artifacts/sehatak-app
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --reset-cache
        env:
          NODE_ENV: production
          NODE_PATH: "${{ github.workspace }}/node_modules:${{ github.workspace }}/artifacts/sehatak-app/node_modules"

      - name: Make Gradlew executable
        working-directory: artifacts/sehatak-app/android
        run: chmod +x gradlew

      - name: Build APK (skip JS bundle step — already done)
        working-directory: artifacts/sehatak-app/android
        run: |
          ./gradlew assembleDebug \
            -x bundleDebugJsAndAssets \
            -x createBundleDebugJsAndAssets \
            --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Find and rename APK
        run: |
          APK_PATH=$(find artifacts/sehatak-app/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" sehatak-app.apk

      - name: Delete old release if exists
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "صحتك أولاً — آخر إصدار"
          body: "تحميل مباشر لتطبيق صحتك أولاً"
          files: sehatak-app.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
