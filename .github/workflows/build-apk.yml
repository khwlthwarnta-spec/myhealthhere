name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'artifacts/sehatak-app/**'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Runtimes ────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 3. Install pnpm & dependencies ─────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ── 4. Expo Prebuild (generates android/ folder) ───────────────────────
      - name: Install Expo CLI
        run: npm install -g @expo/cli@latest

      - name: Run Expo Prebuild
        working-directory: artifacts/sehatak-app
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'

      # ── 5. Bundle JavaScript manually (bypasses Metro server dependency) ───
      - name: Create Android assets directory
        run: mkdir -p artifacts/sehatak-app/android/app/src/main/assets

      - name: Bundle JS with expo export:embed
        working-directory: artifacts/sehatak-app
        run: |
          npx expo export:embed \
            --platform android \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --dev false \
            --reset-cache
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: 'http://localhost'

      # ── 6. Build APK with Gradle (skip JS re-bundling) ─────────────────────
      - name: Make Gradlew executable
        working-directory: artifacts/sehatak-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: artifacts/sehatak-app/android
        run: |
          ./gradlew assembleDebug \
            -x bundleDebugJsAndAssets \
            -x createBundleDebugJsAndAssets \
            --no-daemon \
            --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"

      # ── 7. Locate & rename APK ─────────────────────────────────────────────
      - name: Locate APK
        id: apk
        run: |
          APK=$(find artifacts/sehatak-app/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"

      - name: Copy APK to workspace root
        run: cp "${{ steps.apk.outputs.path }}" sehatak-app.apk

      # ── 8. Publish to GitHub Releases (permanent direct link) ──────────────
      - name: Remove old 'latest' release
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "صحتك أولاً — آخر إصدار"
          body: |
            ### تحميل التطبيق
            اضغط على `sehatak-app.apk` في الأسفل للتحميل المباشر.
          files: sehatak-app.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
