name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'artifacts/sehatak-app/**'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ── تثبيت الحزم (بدون ignore-scripts حتى تعمل الحزم الأصيلة) ──────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── توليد مجلد android/ ────────────────────────────────────────────────
      - name: Expo Prebuild
        working-directory: artifacts/sehatak-app
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ── بناء JS bundle يدوياً (المسار المطلق هو الحل الصحيح) ──────────────
      - name: Create assets folder
        run: mkdir -p artifacts/sehatak-app/android/app/src/main/assets

      - name: Bundle JavaScript
        working-directory: artifacts/sehatak-app
        run: |
          ENTRY="$PWD/node_modules/expo-router/entry.js"
          echo "✅ Entry file: $ENTRY"
          ls -la "$ENTRY"
          npx expo export:embed \
            --platform android \
            --entry-file "$ENTRY" \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --dev false
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: 'http://localhost'

      # ── بناء APK مع تخطي خطوة bundle (تمت يدوياً) ────────────────────────
      - name: Make gradlew executable
        run: chmod +x artifacts/sehatak-app/android/gradlew

      - name: Build debug APK
        working-directory: artifacts/sehatak-app/android
        run: |
          ./gradlew assembleDebug \
            -x bundleDebugJsAndAssets \
            -x createBundleDebugJsAndAssets \
            --no-daemon \
            --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"

      # ── إيجاد الـ APK ──────────────────────────────────────────────────────
      - name: Find APK
        id: find_apk
        run: |
          APK=$(find artifacts/sehatak-app/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "✅ APK found: $APK"
          cp "$APK" sehatak-app.apk

      # ── رفع على GitHub Releases (رابط مباشر دائم) ─────────────────────────
      - name: Delete old release
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "صحتك أولاً — آخر إصدار"
          body: "اضغط على sehatak-app.apk أدناه للتحميل المباشر"
          files: sehatak-app.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
