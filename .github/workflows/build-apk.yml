name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'artifacts/sehatak-app/**'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Expo CLI
        run: pnpm add -g expo-cli @expo/cli eas-cli

      - name: Run Expo Prebuild (generate native Android project)
        working-directory: artifacts/sehatak-app
        run: |
          npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Make Gradlew executable
        working-directory: artifacts/sehatak-app/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: artifacts/sehatak-app/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Find and rename APK
        run: |
          APK_PATH=$(find artifacts/sehatak-app/android -name "*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" sehatak-app.apk

      - name: Delete old release if exists
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "صحتك أولاً — آخر إصدار"
          body: "تحميل مباشر لتطبيق صحتك أولاً"
          files: sehatak-app.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
